name: ci

on:
  push:
    branches: ["claude/**"]
  pull_request:
  # Reusado pelo deploy.yml como gate. Push na main NAO dispara o ci sozinho:
  # a main e' validada aqui dentro do run do deploy antes de ir pra VPS.
  workflow_call: {}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: "."
          APP_SECRET: "ci-test-secret-not-for-prod"
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
